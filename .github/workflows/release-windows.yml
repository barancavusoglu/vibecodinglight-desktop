name: Prepare Windows draft release

on:
  push:
    tags: ['windows-v*']

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Verify tag and build
        shell: pwsh
        run: |
          [xml]$props = Get-Content windows/Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne "windows-v$version") { throw 'Release tag and source version do not match.' }
          dotnet restore windows/Tests/AiLight.Tests.csproj --locked-mode --configfile NuGet.Config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore windows/App/AiLight.App.csproj --locked-mode --configfile NuGet.Config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./windows/build.ps1 -NoRestore
      - name: Package installer and license notices
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1
      - name: Create draft prerelease for review
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = "windows/dist/releases/VibeCodingLight-$env:GITHUB_REF_NAME-win-x64.zip"
          gh release create $env:GITHUB_REF_NAME --draft --prerelease --title "Windows $env:GITHUB_REF_NAME" --notes 'VibeCodingLight for Windows.' $archive "$archive.sha256"
          exit $LASTEXITCODE
