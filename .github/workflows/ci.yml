name: CI

on:
  push:
    branches: [main, cross-platform-parity, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  AVALONIA_TELEMETRY_OPTOUT: 1

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build and isolated integration checks
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Check online installer on Windows PowerShell and PowerShell 7
        shell: pwsh
        run: |
          powershell.exe -NoProfile -Command "Invoke-Expression ([IO.File]::ReadAllText('windows/Tests/online-install.test.ps1'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File windows/Tests/online-install.test.ps1
          exit $LASTEXITCODE
      - name: Restore locked dependencies
        shell: pwsh
        run: |
          dotnet restore windows/Tests/AiLight.Tests.csproj --locked-mode --configfile NuGet.Config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore windows/Desktop/AiLight.Desktop.Windows.csproj --locked-mode --configfile NuGet.Config
          exit $LASTEXITCODE
      - name: Build, regression tests and packaged transport checks
        shell: pwsh
        run: ./windows/build.ps1 -NoRestore
      - name: Offline responsive and theme checks
        shell: pwsh
        run: |
          ./windows/check-ui.ps1
          ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-development-build
          path: |
            windows/dist/VibeCodingLight-Setup.exe
            windows/dist/ci-*.png
            LICENSE
            NOTICE
            THIRD_PARTY_NOTICES.md
            licenses/
          retention-days: 14
          if-no-files-found: error

  macos:
    name: macOS source preview checks
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Restore locked dependencies
        run: |
          dotnet restore windows/Tests/AiLight.Tests.csproj --locked-mode --configfile NuGet.Config
          dotnet restore macos/AiLight.Mac.csproj --locked-mode --configfile NuGet.Config
      - name: Shared regression suite
        run: dotnet run --project windows/Tests/AiLight.Tests.csproj -c Release --no-restore
      - name: Mac online installer fixtures
        run: node --test macos/Tests/online-install.test.mjs
      - name: Mac service and Swift helper checks
        run: dotnet run --project macos/AiLight.Mac.csproj -c Release --no-restore -- --self-test
      - name: Native serial disconnect with a queued write
        run: |
          dotnet build tests/macos-serial/SerialSmoke.csproj -c Release
          python3 tests/macos-serial/run.py "$(command -v dotnet)" "$PWD/tests/macos-serial/bin/Release/net10.0/SerialSmoke.dll"
      - name: Offline UI and lifecycle parity checks
        run: bash macos/check-ui.sh
      - name: OpenCode Unix socket and process-exit integration
        run: node windows/Tests/opencode.test.mjs "$PWD/macos/bin/Release/net10.0/VibeCodingLight" mac
      - name: Build Apple Silicon development bundle
        run: |
          bash macos/build.sh arm64
          archives=(macos/dist/VibeCodingLight-macos-arm64-*.zip)
          [[ ${#archives[@]} -eq 1 ]] || exit 1
          bash scripts/package-macos.sh "${archives[0]}"
          VCL_MAC_REAL_ARCHIVE="${archives[0]}" VCL_MAC_REAL_VERSION="$(dotnet msbuild macos/AiLight.Mac.csproj -getProperty:Version -nologo)" VCL_MAC_REAL_COMMIT="$GITHUB_SHA" node --test --test-name-pattern='real Mac archive' macos/Tests/online-install.test.mjs
          shasum -a 256 macos/dist/VibeCodingLight-macos-arm64-*.zip > macos/dist/macos-development.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-development-build
          path: |
            macos/dist/ci-*.png
            macos/dist/VibeCodingLight-macos-arm64-*.zip
            macos/dist/macos-development.sha256
          retention-days: 14
          if-no-files-found: error
